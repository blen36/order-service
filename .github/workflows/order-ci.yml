name: Order Service CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ORDER_PORT: "8083"
      ORDER_DB_HOST: localhost
      ORDER_DB_PORT: "5434"
      ORDER_DB_NAME: order_service_db
      ORDER_DB_USER: order_app
      ORDER_IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: bash ./mvnw -B -ntp clean test-compile

      - name: Unit and integration tests
        run: bash ./mvnw -B -ntp verify

      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order-test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Build and start the Docker image with PostgreSQL
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "ORDER_DB_PASSWORD=$password" >> "$GITHUB_ENV"
          export ORDER_DB_PASSWORD="$password"
          docker compose up -d --build --wait order-service
          docker compose exec -T order-postgres psql -U "$ORDER_DB_USER" -d "$ORDER_DB_NAME" \
            -v ON_ERROR_STOP=1 -c 'SELECT id FROM orders LIMIT 0'

      - name: Export Docker image
        run: docker save "order-service:$ORDER_IMAGE_TAG" | gzip -1 > order-service-image.tar.gz
        shell: bash

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: order-service-image-${{ github.sha }}
          path: order-service-image.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Show container logs on failure
        if: failure() && env.ORDER_DB_PASSWORD != ''
        run: docker compose logs --tail=80 order-service order-postgres

      - name: Stop CI containers
        if: always() && env.ORDER_DB_PASSWORD != ''
        run: docker compose down --volumes
